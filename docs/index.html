<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>振幅監控</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #6a737d;
    --line: #e3e6ea; --day: #2563eb; --night: #d97706; --full: #059669;
    --main: #7c3aed; --oil: #0e7490; --avg: #6a737d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --card: #1b2027; --text: #e8ebef; --muted: #8b95a1;
      --line: #2b323b; --day: #6ea0ff; --night: #f2a63b; --full: #3ccf9a;
      --main: #a78bfa; --oil: #22d3ee; --avg: #8b95a1;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .tabs, .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .controls { margin-left: auto; }
  .tabs button, .controls button { border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tabs button { font-size: 14px; padding: 6px 16px; }
  .tabs button.on, .controls button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .name { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .card .pts { font-size: 28px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .pts small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .card .pct { color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .chartbox { position: relative; height: 320px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .scroll { overflow-x: auto; }
  .note { color: var(--muted); font-size: 12.5px; line-height: 1.7; }
  #err { color: #c0392b; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>振幅監控</h1>
    <div class="tabs" id="tabs"></div>
    <span class="sub" id="updated">載入中…</span>
    <div class="controls" id="ctl"></div>
  </header>
  <p id="err"></p>

  <div class="cards" id="cards"></div>

  <div class="panel scroll">
    <div class="sub" id="extTitle" style="margin-bottom:6px"></div>
    <table id="ext"></table>
  </div>

  <div class="panel">
    <div class="chartbox"><canvas id="chart"></canvas></div>
  </div>

  <div class="panel scroll">
    <table id="tbl"></table>
  </div>

  <p class="note" id="note"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function () {
  // flat = 每天只有單一全日盤（資料檔為 {date, open, high, low, close, amp, pct}）
  // dec = 振幅顯示的小數位數；unit = 振幅單位；lots = 每口金額換算（名稱、每單位振幅的美元）
  var MARKETS = {
    tx: {
      label: "台指期 TX", file: "data.json", flat: false, dec: 0, unit: "點", lots: [], ohlc: false,
      sessions: [
        { key: "day",   label: "日盤",   color: "--day" },
        { key: "night", label: "夜盤",   color: "--night" },
        { key: "full",  label: "全日盤", color: "--full" }
      ],
      note: "台指期(TX)近月合約。日盤 08:45–13:45；夜盤為前一晚 15:00 至當日 05:00；全日盤為同一交易日的夜盤加日盤。<br>" +
            "振幅 = 最高價 − 最低價；百分比 = 振幅 ÷ 該時段開盤價（全日盤以夜盤開盤價計）。<br>" +
            "平均值取各時段最近 N 筆有資料的交易日。資料來源：臺灣期貨交易所，每個交易日 15:30 後自動更新。"
    },
    mnq: {
      label: "MNQ", file: "mnq.json", flat: true, dec: 0, unit: "點", ohlc: true,
      lots: [ { n: "MNQ", m: 2 } ],
      sessions: [ { key: "full", label: "全日盤", color: "--main" } ],
      note: "微型那斯達克100期貨（MNQ）近月連續合約，全日盤＝CME 一個完整交易日（前一日 17:00 CT 至當日 16:00 CT）。<br>" +
            "振幅 = 最高價 − 最低價；百分比 = 振幅 ÷ 開盤價；每口金額 = 振幅 × US$2（MNQ 每點 2 美元，未含手續費）。<br>" +
            "資料來源：Yahoo Finance，每個交易日收盤後（台灣時間早上）自動更新；與 TradingView 或券商的 K 棒可能有些微差異。"
    },
    wti: {
      label: "WTI 原油", file: "wti.json", flat: true, dec: 2, unit: "美元", ohlc: true, price: true,
      lots: [],
      sessions: [ { key: "full", label: "全日盤", color: "--oil" } ],
      note: "WTI 原油期貨（CL）近月連續合約，全日盤＝CME Globex 一個完整交易日（前一日 17:00 CT 至當日 16:00 CT）。<br>" +
            "日均價 = 當日成交量加權均價（VWAP，由 1 小時線近似，每根取 (高＋低＋收)÷3 加權）；N 日均價 = 最近 N 個交易日日均價的平均，並另列整段期間的量加權均價。最高價／最低價 = 這 N 日內出現過的最高與最低價（美元／桶）。表中標 * 的日子沒有成交量資料，改以 (開＋高＋低＋收)÷4 估算。<br>" +
            "資料來源：Yahoo Finance（CL=F），每個交易日收盤後（台灣時間早上）自動更新；換月當天連續合約的價格可能與券商的 K 棒有差異，請以你的看盤軟體核對。"
    }
  };
  var ORDER = ["tx", "mnq", "wti"];
  var OPTIONS = [5, 10, 20, 60];
  var state = { market: "tx", n: 20, data: {}, chart: null };

  function $(id) { return document.getElementById(id); }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function fmt(x, d) { return x == null ? "—" : x.toFixed(d); }
  function money(x) { return x == null ? "—" : "$" + Math.round(x).toLocaleString("en-US"); }
  function mean(a) { return a.length ? a.reduce(function (s, v) { return s + v; }, 0) / a.length : null; }
  function cur() { return MARKETS[state.market]; }
  function fa(x) { return fmt(x, cur().dec); }
  function lotsText(amp) {
    if (amp == null) return "";
    return cur().lots.map(function (l) { return l.n + " " + money(amp * l.m); }).join(" · ");
  }
  function rowsOf() { var d = state.data[state.market]; return d ? d.rows : []; }
  function lastValid(key) { return rowsOf().filter(function (r) { return r[key]; }).slice(-state.n); }

  function windowStats(n) {
    var rs = rowsOf().slice(-n);
    if (!rs.length) return null;
    var hi = rs[0], lo = rs[0];
    rs.forEach(function (r) {
      if (r.full.high > hi.full.high) hi = r;
      if (r.full.low < lo.full.low) lo = r;
    });
    var vol = 0, pv = 0, est = 0;
    rs.forEach(function (r) { if (r.full.vol > 0) { vol += r.full.vol; pv += r.full.pv; } else est++; });
    return { n: rs.length, avg: mean(rs.map(function (r) { return r.full.avg; })),
             wavg: vol > 0 ? pv / vol : null, est: est,
             hi: hi.full.high, hiDate: hi.date, lo: lo.full.low, loDate: lo.date };
  }

  function renderPriceCards() {
    var html = "";
    [state.n].forEach(function (n) {  // 只顯示目前選的天數
      var s = windowStats(n);
      if (!s) return;
      html += '<div class="card"><div class="name">近 ' + s.n + ' 日均價</div>' +
        '<div class="pts">' + fa(s.avg) + '<small>美元</small></div>' +
        '<div class="pct">' + (s.wavg != null ? '量加權 ' + fa(s.wavg) + '<br>' : '') + (s.est ? '含 ' + s.est + ' 日估算<br>' : '') + '最高 ' + fa(s.hi) + '（' + s.hiDate.slice(5) + '）<br>最低 ' + fa(s.lo) + '（' + s.loDate.slice(5) + '）</div></div>';
    });
    var all = rowsOf(), last = all[all.length - 1];
    if (last) {
      html += '<div class="card"><div class="name">最新一日 ' + last.date + '</div>' +
        '<div class="pts">' + fa(last.full.avg) + '<small>日均價</small></div>' +
        '<div class="pct">高 ' + fa(last.full.high) + ' · 低 ' + fa(last.full.low) + ' · 收 ' + fa(last.full.close) + '</div></div>';
    }
    $("cards").innerHTML = html;
  }

  function priceSets(rows) {
    function ds(label, color, fn, dash) {
      return { label: label, data: rows.map(fn), borderColor: css(color), backgroundColor: css(color),
               borderWidth: 2, pointRadius: rows.length > 30 ? 0 : 3, tension: 0.15, borderDash: dash || [] };
    }
    return [
      ds("最高價", "--day",   function (r) { return r.full.high; }, [4, 3]),
      ds("日均價", "--oil",   function (r) { return r.full.avg; }),
      ds("最低價", "--night", function (r) { return r.full.low; },  [4, 3])
    ];
  }

  function marketFromHash() {
    var h = (location.hash || "").replace("#", "");
    return MARKETS[h] ? h : "tx";
  }

  function renderTabs() {
    var box = $("tabs");
    box.innerHTML = "";
    ORDER.forEach(function (k) {
      var b = document.createElement("button");
      b.textContent = MARKETS[k].label;
      if (k === state.market) b.className = "on";
      b.onclick = function () { location.hash = k; };
      box.appendChild(b);
    });
  }

  function renderControls() {
    var box = $("ctl");
    box.innerHTML = "";
    OPTIONS.forEach(function (n) {
      var b = document.createElement("button");
      b.textContent = n + " 日";
      if (n === state.n) b.className = "on";
      b.onclick = function () { state.n = n; render(); };
      box.appendChild(b);
    });
  }

  function renderCards() {
    if (cur().price) { renderPriceCards(); return; }
    var M = cur(), html = "";
    M.sessions.forEach(function (s) {
      var rows = lastValid(s.key);
      var pts = mean(rows.map(function (r) { return r[s.key].amp; }));
      var pct = mean(rows.map(function (r) { return r[s.key].pct; }));
      html += '<div class="card"><div class="name"><span class="dot" style="background:var(' + s.color + ')"></span>' +
        s.label + ' · 近 ' + rows.length + ' 日平均</div>' +
        '<div class="pts">' + fa(pts) + '<small>' + M.unit + '</small></div>' +
        '<div class="pct">' + fmt(pct, 2) + '%' +
        (M.lots.length && pts != null ? ' · 每口 ' + lotsText(pts) : '') + '</div></div>';
    });
    if (M.flat) {
      var key = M.sessions[0].key, all = rowsOf(), latest = all[all.length - 1];
      var avg = mean(lastValid(key).map(function (r) { return r[key].amp; }));
      if (latest && latest[key]) {
        var ratio = avg ? latest[key].amp / avg : null;
        html += '<div class="card"><div class="name">最新一日 ' + latest.date + '</div>' +
          '<div class="pts">' + fa(latest[key].amp) + '<small>' + M.unit + '</small></div>' +
          '<div class="pct">' + fmt(latest[key].pct, 2) + '% · 為平均的 ' + fmt(ratio, 2) + ' 倍</div></div>';
      }
    }
    $("cards").innerHTML = html;
  }

  function renderExtremes() {
    var M = cur();
    $("extTitle").textContent = "近 " + state.n + " 日振幅極值（依" + (M.unit === "點" ? "點數" : "金額") + "排序）";
    var head = "<tr><th></th>";
    M.sessions.forEach(function (s) { head += "<th>" + s.label + "</th>"; });
    head += "</tr>";

    var sorted = {};
    M.sessions.forEach(function (s) {
      sorted[s.key] = lastValid(s.key).map(function (r) {
        return { date: r.date, amp: r[s.key].amp, pct: r[s.key].pct };
      }).sort(function (a, b) { return b.amp - a.amp; });
    });

    var picks = [
      { label: "最高",   at: function (n) { return 0; } },
      { label: "第二高", at: function (n) { return 1; } },
      { label: "第二低", at: function (n) { return n - 2; } },
      { label: "最低",   at: function (n) { return n - 1; } }
    ];
    var body = picks.map(function (p) {
      var tr = "<tr><td>" + p.label + "</td>";
      M.sessions.forEach(function (s) {
        var a = sorted[s.key];
        var v = a.length >= 4 ? a[p.at(a.length)] : null;
        tr += "<td>" + (v
          ? fa(v.amp) + " " + M.unit + " · " + fmt(v.pct, 2) + "%" + (M.lots.length ? " · " + lotsText(v.amp) : "") +
            '<br><span class="sub">' + v.date + "</span>"
          : "—") + "</td>";
      });
      return tr + "</tr>";
    }).join("");
    $("ext").innerHTML = head + body;
  }

  function renderChart() {
    var M = cur(), rows = rowsOf().slice(-state.n);
    var labels = rows.map(function (r) { return r.date.slice(5).replace("-", "/"); });
    var datasets = M.price ? priceSets(rows) : M.sessions.map(function (s) {
      return {
        label: s.label,
        data: rows.map(function (r) { return r[s.key] ? r[s.key].amp : null; }),
        borderColor: css(s.color), backgroundColor: css(s.color),
        borderWidth: 2, pointRadius: rows.length > 30 ? 0 : 3, tension: 0.15, spanGaps: false
      };
    });
    if (!M.price && M.sessions.length === 1) {
      var avg = mean(lastValid(M.sessions[0].key).map(function (r) { return r[M.sessions[0].key].amp; }));
      datasets.push({
        label: "平均", data: rows.map(function () { return avg; }),
        borderColor: css("--avg"), borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0
      });
    }
    var txt = css("--muted"), grid = css("--line");
    if (state.chart) state.chart.destroy();
    state.chart = new Chart($("chart"), {
      type: "line",
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { labels: { color: txt } } },
        scales: {
          x: { ticks: { color: txt, maxRotation: 0, autoSkip: true }, grid: { color: grid } },
          y: { beginAtZero: !M.price, title: { display: true, text: M.price ? "價格（美元／桶）" : "振幅（" + M.unit + "）", color: txt },
               ticks: { color: txt }, grid: { color: grid } }
        }
      }
    });
  }

  function renderTable() {
    var M = cur();
    if (M.price) {
      var h = "<tr><th>交易日</th><th>開盤</th><th>最高</th><th>最低</th><th>收盤</th><th>日均價</th><th>成交量</th></tr>";
      var b = rowsOf().slice(-state.n).reverse().map(function (r) {
        var f = r.full;
        return "<tr><td>" + r.date + "</td><td>" + fa(f.open) + "</td><td>" + fa(f.high) + "</td><td>" + fa(f.low) +
               "</td><td>" + fa(f.close) + "</td><td>" + fa(f.avg) + (f.src === "ohlc4" ? "*" : "") + "</td><td>" + (f.vol ? f.vol.toLocaleString("en-US") : "—") + "</td></tr>";
      }).join("");
      $("tbl").innerHTML = h + b;
      return;
    }
    var head = "<tr><th>交易日</th>";
    if (M.ohlc) head += "<th>開盤</th><th>最高</th><th>最低</th><th>收盤</th>";
    M.sessions.forEach(function (s) {
      head += "<th>" + s.label + (M.sessions.length > 1 ? " 點數" : " 振幅（" + M.unit + "）") + "</th><th>%</th>";
      M.lots.forEach(function (l) { head += "<th>" + l.n + " 每口</th>"; });
    });
    head += "</tr>";
    var body = rowsOf().slice(-state.n).reverse().map(function (r) {
      var tr = "<tr><td>" + r.date + "</td>";
      if (M.ohlc) {
        var f = r.full;
        tr += "<td>" + (f ? fmt(f.open, 2) : "—") + "</td><td>" + (f ? fmt(f.high, 2) : "—") +
          "</td><td>" + (f ? fmt(f.low, 2) : "—") + "</td><td>" + (f ? fmt(f.close, 2) : "—") + "</td>";
      }
      M.sessions.forEach(function (s) {
        var v = r[s.key];
        tr += "<td>" + (v ? fa(v.amp) : "—") + "</td><td>" + (v ? fmt(v.pct, 2) : "—") + "</td>";
        M.lots.forEach(function (l) { tr += "<td>" + (v ? money(v.amp * l.m) : "—") + "</td>"; });
      });
      return tr + "</tr>";
    }).join("");
    $("tbl").innerHTML = head + body;
  }

  function render() {
    var M = cur(), d = state.data[state.market];
    renderTabs();
    renderControls();
    $("note").innerHTML = M.note;
    if (!d) {
      $("err").style.display = "block";
      $("err").textContent = "資料載入失敗，請確認 " + M.file + " 是否存在（需先在 Actions 手動執行一次更新）。";
      $("updated").textContent = "";
      ["cards", "ext", "tbl", "extTitle"].forEach(function (id) { $(id).innerHTML = ""; });
      if (state.chart) { state.chart.destroy(); state.chart = null; }
      return;
    }
    $("ext").parentNode.style.display = M.price ? "none" : "";
    $("err").style.display = "none";
    $("updated").textContent = "資料更新：" + d.updated;
    renderCards(); renderExtremes(); renderChart(); renderTable();
  }

  function normalizeFlat(d) {
    // 單一全日盤的資料轉成與台指期相同的 {date, full:{...}} 格式
    d.rows = d.rows.map(function (r) {
      return { date: r.date, full: { open: r.open, high: r.high, low: r.low, close: r.close, amp: r.amp, pct: r.pct,
                avg: r.avg != null ? r.avg : (r.open + r.high + r.low + r.close) / 4,
                vol: r.vol || 0, pv: r.pv || 0, src: r.avg_src || "ohlc4" } };
    });
    return d;
  }

  function load(key) {
    return fetch(MARKETS[key].file + "?_=" + Date.now())
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { state.data[key] = MARKETS[key].flat ? normalizeFlat(d) : d; })
      .catch(function () { state.data[key] = null; });
  }

  window.addEventListener("hashchange", function () { state.market = marketFromHash(); render(); });
  state.market = marketFromHash();
  Promise.all(ORDER.map(load)).then(render);
})();
</script>
</body>
</html>
